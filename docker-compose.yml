services:
  chromadb:
    image: chromadb/chroma:0.4.22
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "8000:8000"
    command: uvicorn chromadb.app:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped